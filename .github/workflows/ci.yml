name: CI

# On pull requests into dev and main, and on every push to dev. The fast checks
# are scripts/ci/check, which the pre-push hook also runs; the tests and the
# image build are here alone.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions: {}

# A new push to a pull request replaces its run. A push to dev never cancels
# one in progress, so dev is checked commit by commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The whole history: the checks compare the branch with its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the Python workspace
        run: uv sync --locked

      # Before setup-node, whose pnpm cache asks pnpm where its store is. The
      # version is package.json's packageManager.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: pnpm

      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile

      # A pull request checks what it changed; a push to dev checks everything.
      - name: scripts/ci/check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE_REF="origin/$BASE" scripts/ci/check
          else
            scripts/ci/check all
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    env:
      # The superuser: each run creates its own database and both logins.
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the Python workspace
        run: uv sync --locked

      - name: pytest
        run: uv run --no-sync pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: pnpm

      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        run: pnpm test

  # Each app's image builds. On pull requests only: a push to dev builds and
  # publishes the same image (publish.yml).
  image:
    name: Image (${{ matrix.app }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One entry per app with an image.
        app: [hoard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built and discarded. It reads the cache dev's publishing writes and
      # writes none of its own.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=image-${{ matrix.app }}
