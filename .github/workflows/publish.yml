name: Publish images

# Pushes each app's image to ghcr.io/<owner>/<app>, then scans the image pushed
# with Trivy.
#
#   push to dev          every app's image, as :dev and :sha-<short commit>
#   tag <app>-v<x.y.z>   that app's image, as :<x.y.z>; the version must be the
#                        one apps/<app>/VERSION holds. Then its release: the
#                        GitHub Release, carrying its registry source built for
#                        that image by digest, and the request that
#                        initiative-packages pin it into the packages our
#                        deployments read.
on:
  push:
    branches: [dev]
    # One pattern per app with an image.
    tags:
      - "hoard-v*"

permissions: {}

# :dev only ever means the newest dev, so a newer push to dev replaces a build
# still running. A version's build is never cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  apps:
    name: Which images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the apps to build
        id: apps
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            if [[ ! "$REF_NAME" =~ ^([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::$REF_NAME is not <app>-v<major>.<minor>.<patch>."
              exit 1
            fi
            app="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            if [[ ! -f "apps/$app/Dockerfile" ]]; then
              echo "::error::$REF_NAME names $app, which has no apps/$app/Dockerfile."
              exit 1
            fi
            if [[ "$(cat "apps/$app/VERSION")" != "$version" ]]; then
              echo "::error::$REF_NAME says $version; apps/$app/VERSION says $(cat "apps/$app/VERSION")."
              exit 1
            fi
            apps=$(jq -cn --arg app "$app" '[$app]')
          else
            apps=$(for file in apps/*/Dockerfile; do basename "$(dirname "$file")"; done | jq -cnR '[inputs]')
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Building: $apps"

  image:
    name: Image (${{ matrix.app }})
    needs: apps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    # A tag builds one app, so the one image a release names.
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the image and its tags
        id: name
        env:
          APP: ${{ matrix.app }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/$APP"
          if [[ "$REF" == refs/tags/* ]]; then
            version="${REF_NAME#"$APP"-v}"
            tags="$image:$version"
          else
            # The version a dev image is on its way to, and the commit it is.
            version="$(cat "apps/$APP/VERSION")-dev.${SHA::7}"
            tags="$image:dev"$'\n'"$image:sha-${SHA::7}"
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.name.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The runtime stage takes Debian's security updates, so it is built
          # afresh every time rather than from the cache; the stages before it
          # still come from the cache.
          no-cache-filters: runtime
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,scope=image-${{ matrix.app }},mode=max

      # The image just pushed, by digest: its OS packages and everything in its
      # layers. Fails on HIGH and CRITICAL findings that have a fix.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release:
    name: GitHub Release
    needs: [apps, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      app: ${{ steps.source.outputs.app }}
      sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the Python workspace
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"

      - name: Build the registry source
        id: source
        env:
          APPS: ${{ needs.apps.outputs.apps }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          app="$(jq -r '.[0]' <<<"$APPS")"
          sha256="$(scripts/release/registry-source.sh "$app" "$IMAGE" "$app-registry-source.tar.gz")"
          {
            echo "app=$app"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.source.outputs.app }}-registry-source.tar.gz

  pin:
    name: Pin the release in the packages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Get the release app's token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: initiative-packages
          permission-contents: write

      # initiative-packages checks the release itself, then commits the pin.
      - name: Send release-pin to initiative-packages
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP: ${{ needs.release.outputs.app }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          jq -n --arg repository "$REPOSITORY" --arg tag "$TAG" \
            --arg asset "$APP-registry-source.tar.gz" --arg sha256 "$SHA256" '{
              event_type: "release-pin",
              client_payload: {repository: $repository, tag: $tag, asset: $asset, sha256: $sha256}
            }' | gh api -X POST "repos/$OWNER/initiative-packages/dispatches" --input -
          echo "asked initiative-packages to pin $TAG ($SHA256)"
