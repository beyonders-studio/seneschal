[project]
name = "hoard"
version = "0.0.1"
description = "Hoard: inventory and production, a plug-in for Initiative"
requires-python = "==3.12.*"
license = "AGPL-3.0-only"
dependencies = [
  "seneschal-core",
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "fpdf2==2.9.0",
  "pydantic-settings==2.16.2",
  "sqlmodel==0.0.48",
  "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
seneschal-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
