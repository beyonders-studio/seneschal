[project]
name = "seneschal-core"
version = "0.0.1"
description = "What every Seneschal app's backend shares: organization isolation and the Initiative connection"
requires-python = "==3.12.*"
license = "AGPL-3.0-only"
dependencies = [
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "greenlet==3.5.6",
  "httpx2==2.16.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "PyJWT==2.15.0",
  "sqlmodel==0.0.48",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
